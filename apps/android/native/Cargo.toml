[package]
name = "tracking-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "tracking-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
anyhow.workspace = true
app-platform.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracking-cloud.workspace = true
tracking-core.workspace = true
tracking-data.workspace = true
uniffi = { version = "0.32.2", default-features = false }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
