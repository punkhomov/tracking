[workspace]
members = [
    "crates/core",
    "crates/data",
    "crates/platform",
    "crates/ui",
    "apps/desktop",
    "apps/web",
]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tracking-core = { path = "crates/core" }
tracking-data = { path = "crates/data" }
app-platform = { path = "crates/platform" }
app-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
