name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - name: Verify Rust adapter
        run: |
          cargo test --locked -p tracking-android
          cargo clippy --locked -p tracking-android --all-targets -- -D warnings
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
      - name: Assemble app and instrumentation APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify timer recovery after process restart
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/android/smoke-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tracking-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
